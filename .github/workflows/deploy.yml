name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fetch the code)
        uses: actions/checkout@v4

      - name: Setup Pages (initialize the Pages environment)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Bun (install the package manager)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (from bun.lock)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (a Next-project service step)
        run: bun run db:generate

      - name: Compute base path
        id: basepath
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY_OWNER}"
          if [ "$REPO_NAME" = "$OWNER_NAME.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Version service worker (inject the git SHA)
        run: sed -i "s/__BUILD_ID__-local/${GITHUB_SHA}/" public/sw.js

      - name: Build static site (Next.js static build)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.path }}
        run: bun run build:static

      - name: Upload artifact (hand the built site to Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .next-export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Автоматическая сборка и публикация сайта на GitHub Pages.
#
# Что делает: при каждом `git push` GitHub сам собирает сайт из исходников
# (ставит зависимости, прогоняет next build в статическом режиме) и публикует
# результат на GitHub Pages. Локально ничего собирать не нужно.
#
# Требуется один раз включить в настройках репозитория:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # позволяет запустить сборку вручную из вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (забрать код)
        uses: actions/checkout@v4

      - name: Setup Pages (инициализировать окружение Pages)
        uses: actions/configure-pages@v5
        with:
          # Включить Pages в репозитории автоматически, если ещё не включён.
          # Иначе первый запуск падает с "Get Pages site failed: Not Found"
          # (до ручного переключателя Settings -> Pages -> GitHub Actions).
          enablement: true

      - name: Setup Bun (установить сборщик пакетов)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (поставить зависимости из bun.lock)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (служебный шаг Next-проекта)
        run: bun run db:generate

      # Путь сайта зависит от имени репозитория:
      #   репозиторий "showcase-teams" -> https://login.github.io/showcase-teams/
      #   репозиторий "login.github.io" -> https://login.github.io/ (без пути)
      # Вычисляем basePath автоматически, чтобы оба варианта работали.
      - name: Compute base path
        id: basepath
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY_OWNER}"
          if [ "$REPO_NAME" = "$OWNER_NAME.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site (статическая сборка Next.js)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.path }}
        run: bun run build:static

      - name: Upload artifact (передать собранный сайт в Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .next-export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
